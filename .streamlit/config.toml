[theme]
base = "light"
primaryColor = "#16858A"
backgroundColor = "#F4F7FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#172B3B"
borderColor = "#DCE5EC"
dataframeBorderColor = "#D2DEE7"
dataframeHeaderBackgroundColor = "#17364A"
dataframeHeaderTextColor = "#FFFFFF"
font = "sans-serif"
baseRadius = "14px"
buttonRadius = "10px"
showWidgetBorder = true
showSidebarBorder = true
chartCategoricalColors = ["#16858A", "#3279A7", "#7B72B8", "#53A9B2", "#71869A", "#A58AC0"]

[browser]
gatherUsageStats = false

[server]
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 25

[theme.sidebar]
backgroundColor = "#EDF3F7"
secondaryBackgroundColor = "#F7F9FB"
textColor = "#172B3B"
primaryColor = "#16858A"
borderColor = "#DCE5EC"
