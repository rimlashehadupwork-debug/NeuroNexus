name: Keep Streamlit apps awake

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Streamlit app
        uses: gpenessot/streamlit-keep-alive@main
        with:
          app-urls: |
            https://neuronexus18.streamlit.app/

      - name: Send status email
        if: always()
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: ${{ format('{0}.{1}', 'smtp', 'gmail.com') }}
          server_port: 465
          secure: true
          username: rimlashehad@gmail.com
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "NeuroNexus18 Keep-Alive Status: ${{ job.status }}"
          to: rimlashehadupwork@gmail.com
          from: GitHub Actions <rimlashehad@gmail.com>
          body: |
            Your Streamlit keep-alive check just finished.
            Status: ${{ job.status }}
            App URL: https://neuronexus18.streamlit.app/
